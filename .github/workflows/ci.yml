name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: リポジトリのチェックアウト
      uses: actions/checkout@v4

    - name: JDK 21のセットアップ (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: コードフォーマットの検証 (Lint)
      run: |
        chmod +x gradlew
        ./gradlew spotlessCheck

    - name: Gradleによるビルドとテストの実行
      run: |
        chmod +x gradlew
        ./gradlew build

    - name: 単体・結合テストの実行
      run: ./gradlew test
